# Each case fills in the gem's form with `properties`, generates the code with
# apply(), reopens it as the SQL Editor does, and checks that the form and the
# code come back unchanged. Input columns come from schema.json.
cases:
  - name: whole_table
    properties: { valueFieldColumn: price, weightFieldColumn: qty }
  - name: per_group_custom_name
    properties: { valueFieldColumn: price, weightFieldColumn: qty, outputFieldName: avg_price, groupByColumnNames: [city, category] }
