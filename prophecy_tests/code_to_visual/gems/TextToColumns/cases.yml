# Each case fills in the gem's form with `properties`, generates the code with
# apply(), reopens it as the SQL Editor does, and checks that the form and the
# code come back unchanged. Input columns come from schema.json.
cases:
  - name: split_to_columns
    properties:
      columnNames: full_name
      delimiter: " "
      split_strategy: splitColumns
      noOfColumns: 3
      splitColumnPrefix: name
      splitColumnSuffix: part
  - name: split_to_rows
    properties: { columnNames: full_name, delimiter: ",", split_strategy: splitRows, splitRowsColumnName: name_part }
  - name: pipe_delimiter
    properties: { columnNames: full_name, delimiter: "|", split_strategy: splitColumns, noOfColumns: 2 }
  - name: multi_char_literal_delimiter
    properties: { columnNames: full_name, delimiter: " - ", split_strategy: splitColumns, noOfColumns: 2 }
  - name: regex_delimiter_class
    properties: { columnNames: full_name, delimiter: "[,;]", split_strategy: splitRows, splitRowsColumnName: part }
  - name: regex_delimiter_escaped_parens
    properties: { columnNames: full_name, delimiter: "\\(\\d+\\)", split_strategy: splitColumns, noOfColumns: 2 }
