# Each case fills in the gem's form with `properties`, generates the code with
# apply(), reopens it as the SQL Editor does, and checks that the form and the
# code come back unchanged. The .sql files here are code saved by older
# versions of the gem, which must still reopen.
cases:
  - name: message_with_quotes
    properties: { diag_message: "Component type: Report Text isn't \"supported\"." }
  - name: two_inputs
    relations: [orders, customers]
    properties: { diag_message: Not supported yet }
  - name: no_inputs
    relations: []
    properties: { diag_message: Not supported yet }
